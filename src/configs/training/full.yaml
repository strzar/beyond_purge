# Full training configuration for production runs
max_steps: 1500
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
num_generations: 4
logging_steps: 10
save_strategy: "steps"
save_steps: 500
save_total_limit: 3  # checkpoints at steps 500, 1000, 1500

# Dataset options
dataset_size: 100  # Use full dataset

# Optimizer: use memory-efficient variant to fit in VRAM
optim: paged_adamw_32bit
