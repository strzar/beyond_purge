# Fast training configuration for testing/debugging
max_steps: 100
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
num_generations: 2
logging_steps: 5
save_strategy: "steps"
save_steps: 5
save_total_limit: 20

# Dataset options
dataset_size: 20  # Small dataset for quick testing

# Optimizer: use memory-efficient variant to fit in VRAM
optim: paged_adamw_32bit
